# Preferred servers, in order, for each filetype.
# User lsp-cli.yaml settings replace these lists per filetype.
lsp:
  c:
    - clangd
  cpp:
    - clangd
  cs:
    - dotnet
  cuda:
    - clangd
  go:
    - gopls
  gomod:
    - gopls
  gowork:
    - gopls
  java:
    - jdtls
  javascript:
    - typescript-language-server
  kotlin:
    - kotlin-lsp

  lua:
    - lua-language-server
  objc:
    - clangd
  objcpp:
    - clangd
  perl:
    - perlnavigator
  python:
    - pyright-langserver
  rust:
    - rust-analyzer
  typescript:
    - typescript-language-server
  zig:
    - zls
